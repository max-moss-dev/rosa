\n  }\n}\n<\/script>\n\n\n<script>\n(() => {\n  const calendarCopy = {\n    uk: {locale:'uk-UA', date:'Оберіть дату', cabin:'Оберіть будиночок', previous:'Попередній місяць', next:'Наступний місяць'},\n    en: {locale:'en-GB', date:'Choose a date', cabin:'Choose a cabin', previous:'Previous month', next:'Next month'}\n  };\n  const calendar = () => calendarCopy[document.documentElement.lang] || calendarCopy.uk;\n  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\n  const parse=s=>{const p=s.split('-').map(Number);return p.length===3?new Date(p[0],p[1]-1,p[2]):null};\n  const pretty=value=>{\n    const {locale,date}=calendar();\n    return value ? new Intl.DateTimeFormat(locale,{day:'numeric',month:'long',year:'numeric'}).format(parse(value)) : date;\n  };\n  const close=()=>document.querySelectorAll('.rosa-picker[open]').forEach(x=>x.removeAttribute('open'));\n  const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};\n  function setup(form) {\n    const labels=form.querySelectorAll('label'); if(labels.length<3)return;\n    const select=form.querySelector('select'); if(!select)return;\n    const inputs=[...form.querySelectorAll('input[type=date]')]; if(inputs.length!==2)return;\n    function shell(label,control,kind){\n      if(label.querySelector('.rosa-picker'))return label.querySelector('.rosa-picker');\n      control.classList.add('rosa-native');\n      const box=document.createElement('details');box.className='rosa-picker';box.dataset.kind=kind;\n      const summary=document.createElement('summary');summary.className='rosa-trigger';summary.innerHTML='<span><\/span><span class=\"rosa-chevron\" aria-hidden=\"true\"><\/span>';\n      const panel=document.createElement('div');panel.className='rosa-menu';\n      box.append(summary,panel);label.append(box);\n      box.addEventListener('toggle',()=>{if(box.open){document.querySelectorAll('.rosa-picker[open]').forEach(other=>{if(other!==box)ot
